# dsh-agent-panel bundle patch: inserts its plugin row into the web plugin roster.
# One row mounts BOTH halves: the host side (loopback /api/dsh-agent-panel/* routes
# plus the agrp_pull model tool) and the browser side (the session-header trigger
# and the dropdown panel, served from this package's lib/client.js).
- insert:
    - id: agent-panel
      name: '@local/dsh-agent-panel'
